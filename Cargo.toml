[package]
name = "sparta-solver"
version = "0.3.0"
edition = "2021"
authors = ["Robert Fennis", "Milan Rother"]
license = "AGPL-3.0-or-later"
publish = false

[workspace]
members = ["devtools/matgen", "crates/scalpel", "crates/sparta-capi"]
exclude = ["python"]

[features]
# One GPU backend per build. With neither `metal` nor `vulkan`, `gpu` lets
# `build.rs` pick from the target: Apple Silicon gets Metal, Windows and Linux
# get Vulkan, anything else gets no device. `default-features = false` without
# either backend builds the analysis and the CPU backend only.
default = ["gpu"]
## Compile the target's GPU backend, if it has one.
gpu = []
## Apple Metal on Apple Silicon.
metal = []
## Vulkan compute for AMD and NVIDIA, the default on Windows and Linux. Needs a
## Vulkan 1.3 driver at run time, and glslc (the Vulkan SDK) at build time only
## after a kernel edit; see https://github.com/FennisRobert/SPARTA/issues/31.
vulkan = ["dep:ash"]

[lib]
name = "sparta"

[dependencies]
scalpel = { path = "crates/scalpel" }
rayon = "1.12"
num-complex = "0.4"
serde_json = "1"
ash = { version = "0.38", optional = true }

# Vulkan is the default backend there, so `ash` is needed without the feature.
[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
ash = "0.38"

[dev-dependencies]
rayon = "1.12"
sparta-matgen = { path = "devtools/matgen" }
