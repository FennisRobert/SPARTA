[package]
name = "sparta-solver"
version = "0.1.0"
edition = "2021"
authors = ["Robert Fennis", "Milan Rother"]
license = "AGPL-3.0-or-later"
publish = false

[workspace]
members = ["devtools/matgen", "crates/scalpel", "crates/sparta-capi"]
exclude = ["python"]

[features]
# One GPU backend per build. With neither, `build.rs` picks from the target:
# Apple Silicon gets Metal, everything else gets no device and the CPU backend.
default = []
## Apple Metal on Apple Silicon.
metal = []
## Vulkan compute for AMD and NVIDIA. Needs glslc (the Vulkan SDK) at build
## time and a Vulkan 1.3 driver at run time; see
## https://github.com/FennisRobert/SPARTA/issues/31.
vulkan = ["dep:ash"]

[lib]
name = "sparta"

[dependencies]
scalpel = { path = "crates/scalpel" }
rayon = "1.12"
num-complex = "0.4"
serde_json = "1"
ash = { version = "0.38", optional = true }

[dev-dependencies]
rayon = "1.12"
sparta-matgen = { path = "devtools/matgen" }
